<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jay Bowie — Work</title><meta name="description" content="Jay Bowie — copywriting and design portfolio"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' x='9' font-size='34'%3EJ%3C/text%3E%3C/svg%3E"><style>
:root{--bg:#e8e9eb;--ink:#30312e;--accent:#f26723}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif}
button,a{-webkit-tap-highlight-color:transparent;color:inherit}
button{font:inherit}
a{text-decoration:none}
button{border:0;background:none;cursor:pointer}
header{position:absolute;inset:30px 4.3% auto 5.8%;display:flex;justify-content:space-between;z-index:5}
 .brand{position:relative;font-size:31.9px;font-weight:400;letter-spacing:0;display:flex;align-items:flex-start;padding:0;line-height:1.4;width:max-content;min-height:1.4em}
.roll-cell{display:block;height:1.4em;overflow:visible;flex-shrink:0}
.roll-track{display:block;will-change:transform,opacity;clip-path:inset(0 0 0 0);transform-origin:50% 68%}
.roll-face{display:block;height:1.4em;line-height:1.4;white-space:pre}
.roll-tail{display:flex;overflow:visible}

.roll-tail .roll-cell{clip-path:inset(-.1em -.04em .12em -.04em)}

.roll-tail .roll-cell[data-n="2"]{clip-path:inset(-.1em -.04em -.08em -.04em)}

nav{position:fixed;top:30px;right:4.3%;display:flex;flex-direction:column;align-items:flex-start;gap:23px;padding-top:28px;perspective:400px}
nav a,nav button{font-size:19px;padding:0;transform-origin:right;opacity:0;animation:unfold .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:1.65s}
nav>:nth-child(2){animation-delay:1.8s}
nav>:nth-child(3){animation-delay:1.95s}
nav .active{color:var(--accent)}
@keyframes unfold{from{opacity:0;transform:rotateY(85deg) translateX(16px)}
to{opacity:1;transform:none}
}

main{width:72%;max-width:1250px;margin:0 auto;padding:245px 0 130px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:50px 38px}
.emerge{opacity:0;animation:emerge 1.25s cubic-bezier(.18,.65,.25,1) forwards;animation-delay:calc(1.95s + var(--i)*55ms)}
@keyframes emerge{from{opacity:0;transform:translateY(20px) scale(.98);filter:blur(9px)}
to{opacity:1;transform:none;filter:blur(0)}
}
.card{display:block;position:relative;text-align:left;padding:7px;border-radius:7px;isolation:isolate;width:100%;outline-offset:12px;background:transparent;box-shadow:none;transform-origin:center;transition:transform 1150ms cubic-bezier(.32,0,.22,1)}
.grid{position:relative;isolation:isolate}

.emerge{position:relative;translate:0 0;transition:translate 1200ms cubic-bezier(.32,0,.22,1)}
.emerge.is-expanded{z-index:3}
.emerge:has(.card:hover),.emerge:has(.card:focus-visible){z-index:2}

.thumb{aspect-ratio:229/160;border-radius:9px;background-repeat:no-repeat;background-size:684.72% 987.5%;width:100%}
.caption{padding-top:19px;min-height:53px;font-size:12px;line-height:1.35;position:relative}
.caption strong{font-weight:600;display:block;padding-right:10px}
.caption span{display:block}
.arrow{position:absolute;right:2px;top:22px;opacity:0;transition:opacity .4s}
.card:hover .arrow,.card:focus-visible .arrow{opacity:1}
.project-intro{display:grid;grid-template-columns:1fr 1.6fr;gap:55px;margin-bottom:36px}
.project-intro h1{font-size:19px;line-height:1.5;font-weight:400;margin:0}
.project-intro h1 span{color:var(--accent)}
.project-intro p{font-size:16px;line-height:1.55;margin:0 0 12px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.piece{background-repeat:no-repeat;border-radius:7px}
.wide{grid-column:1/-1}
.stack{display:grid;gap:18px}
.project-footer{display:flex;justify-content:center;gap:65px;margin-top:90px;font-size:15px}
.project-footer a:hover{color:var(--accent)}
dialog{background:var(--bg);color:var(--ink);max-width:440px;border:0;border-radius:12px;padding:35px;box-shadow:10px 12px 40px #0003}
dialog::backdrop{background:#2225;backdrop-filter:blur(5px)}
dialog p{line-height:1.6}
dialog button{color:var(--accent);padding:10px 0}
.replay{display:block;position:static;width:max-content;margin:0 auto 30px;font-size:11px;letter-spacing:.02em;color:#73766f;padding:8px}
.skip{position:absolute;left:20px;top:-60px}
.skip:focus{top:10px;z-index:20}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent)}

@media(min-width:1800px){.caption{font-size:14px}
}
@media(max-width:1050px){main{width:78%;padding-top:200px}
.grid{grid-template-columns:repeat(3,1fr);gap:32px 24px}
nav a,nav button{font-size:16px}

}

/* Momentary press: crossfade raised and recessed lighting without moving content. */
:where(.tactile-control){position:relative;isolation:isolate;border-radius:5px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.tactile-control:not(.soft-card)::before,.tactile-control:not(.soft-card)::after{content:"";position:absolute;inset:-5px;border-radius:inherit;pointer-events:none;transition:opacity 650ms cubic-bezier(.4,0,.2,1);opacity:0}

.tactile-control:not(.soft-card)::before{z-index:-1;background:var(--bg);box-shadow:-8px -8px 15px #ffffffb8,8px 8px 15px #aeb1b45c;filter:blur(4px)}

.tactile-control:not(.soft-card)::after{z-index:2;background:linear-gradient(135deg,#aeb1b418,transparent 52%,#ffffff18);box-shadow:inset 8px 8px 13px #92979b70,inset -8px -8px 13px #ffffffb0;filter:blur(3px)}

.tactile-control:not(.card):not(.artwork-open):not(.brand):not(nav a):not(nav button):hover::before{opacity:.65}

.tactile-control:not(.soft-card).is-pressing::before{opacity:0!important}

.tactile-control:not(.soft-card).is-pressing::after{opacity:1}


.artwork-open{display:block;width:100%;padding:0;border:0;background:transparent;border-radius:5px;cursor:zoom-in}

.artwork-open.tactile-control:not(.soft-card)::after{inset:0}

.artwork-open:focus-visible{outline:2px solid var(--accent);outline-offset:5px}

.viewer-controls{display:flex;gap:18px;align-items:center}

#artwork-viewer .viewer-round,.film-controls .viewer-round{width:42px;height:42px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:23px;cursor:pointer}

.viewer-count{font-size:13px;color:var(--ink)}

.artwork-open[aria-expanded="true"]{outline:1px solid var(--accent);outline-offset:4px}

@media(prefers-reduced-motion:reduce){.tactile-control:not(.soft-card)::before,.tactile-control:not(.soft-card)::after{transition:none}
}

/* Matte membrane: flat at rest, raised on hover, recessed on activation.
   Lighting is separate from artwork; nothing tilts or follows the pointer. */
:root {
  --surface: var(--bg);
  --settle: cubic-bezier(.22,.75,.18,1);
}

body { overflow-x:clip; isolation:isolate; -webkit-font-smoothing:antialiased; }
/* Static microtexture belongs to the substrate, beneath all images and type. */
body::before {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27grain%27%20x%3D%270%27%20y%3D%270%27%20width%3D%27100%25%27%20height%3D%27100%25%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Cpath%20fill%3D%27%23fff%27%20filter%3D%27url%28%23grain%29%27%20d%3D%27M0%200h180v180H0z%27%2F%3E%3C%2Fsvg%3E");
  background-repeat:repeat; opacity:.055; mix-blend-mode:multiply;
}

main { position: relative; }

.grid { grid-auto-rows: 1fr; }

.grid > .emerge { display:flex; min-width:0; }

.card.soft-card {
  position: relative;
  isolation: isolate;
  display: block;
  width: 100%; height: 100%;
  padding: clamp(12px,1.05vw,17px);
  border:0; border-radius:24px;
  background: transparent; box-shadow: none;
  transform-origin: center;
  transition: none;
  touch-action: manipulation;
}

/* The broad outer shoulder fades into the page; the inner slope is diffuse. */
.card.soft-card::before,
.card.soft-card::after {
  content:""; position:absolute; pointer-events:none;
  border-radius:inherit; opacity:0;
  transition:opacity 620ms cubic-bezier(.22,.65,.25,1);
}
.card.soft-card::before {
  inset:-12px; z-index:-2;
  background:var(--surface);
  box-shadow:-13px -15px 28px #ffffffb0,
              13px 17px 29px #95988f55;
  filter:blur(7px);
}
.card.soft-card::after {
  inset:-14px; z-index:-1;
  background:linear-gradient(140deg,#a3a79e09,transparent 55%,#ffffff0d);
  box-shadow:inset 15px 18px 31px #92968d48,
             inset -16px -18px 32px #ffffffa0;
  filter:blur(7px);
}

.card.soft-card .soft-card__content { position:relative; z-index:1; display:block; }

.card.soft-card .thumb { border-radius:8px; }
.caption span { color:#666962; }
.caption strong { font-weight:500; }
.arrow { font-weight:400; color:var(--accent); }

.card.soft-card .caption { padding-bottom: 3px; }

@media (hover:hover) {

  .card.soft-card:hover::before { opacity:1; }

}



.card.soft-card.is-pressing::before { opacity:0; transition-duration:260ms; }
.card.soft-card.is-pressing::after { opacity:1; transition-duration:260ms; }
.project-intro h1 .project-brand { display:block; color:var(--accent); }
.project-intro h1 .project-campaign { display:block; color:#171816; }

.card.soft-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 14px; }

html { scrollbar-gutter:stable; }
body.is-transitioning { overflow:hidden; }
body.is-transitioning main { will-change:transform,opacity,filter; }

nav a,nav button,.emerge { animation: none; opacity: 1; }

body.introducing .brand,body.introducing nav>*,body.introducing .grid { opacity:0; }

body.introducing .grid { pointer-events:none; }

@media(max-width:900px) {
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:32px 24px; }

  .caption { font-size:12px; line-height:1.45; }

}

@media(max-width:380px) {
  .grid { grid-template-columns:1fr; }

}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.001ms!important; animation-delay:0s!important; transition:none!important; }

  .card.soft-card { transform:none!important; }

  body.introducing .brand,body.introducing nav>*,body.introducing .grid { opacity:1; }

}


/* About / personal profile. The scan is a visual sequence over the supplied portrait. */
.sr-only { position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
.about-section {
  position:relative; isolation:isolate; width:88vw; max-width:1500px;
  margin:clamp(160px,17vw,260px) 0 0; left:50%; transform:translateX(-50%);
  padding:80px 0 70px; scroll-margin-top:35px;
}
.about-section:focus {outline:none;}
.about-grid { display:grid;grid-template-columns:1.12fr 1.05fr .78fr;gap:30px;align-items:start;grid-template-areas:'bio portrait stats' 'colour portrait stats'; }
.about-bio {grid-area:bio;padding-top:18px;}
.about-bio p {font-size:clamp(13px,1.13vw,17px);line-height:1.65;margin:0 0 22px;}
.about-bio .decipher-text {display:block;}
.about-bio .decipher-text.is-decoding {color:#6c7168;}
.about-portrait {grid-area:portrait;position:relative;border-radius:38px;background:#f7f8f6;overflow:hidden;aspect-ratio:.88;box-shadow:inset 1px 1px 0 #fff8;}
.profile-photo {position:absolute;inset:15% 7% 9%;display:grid;place-items:center;}
.profile-photo img {display:block;width:100%;height:auto;mix-blend-mode:multiply;mask-image:linear-gradient(#000 88%,transparent 100%);}
.profile-id,.profile-status {position:absolute;left:24px;right:24px;display:flex;justify-content:space-between;gap:12px;font:9px/1.4 'Courier New',monospace;letter-spacing:.1em;color:#757a71;}
.profile-id {top:24px;}.profile-status {bottom:22px;}
.profile-id b {font-weight:400;color:var(--accent);}
.face-map {position:absolute;inset:0;width:100%;height:100%;color:var(--accent);overflow:visible;pointer-events:none;}
.face-map path,.face-map line,.face-map polyline {fill:none;stroke:currentColor;stroke-width:1.15;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;}
.face-map circle {fill:var(--bg);stroke:currentColor;stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;}
.about-section.scan-active .face-map path,.about-section.scan-active .face-map line,.about-section.scan-active .face-map polyline {stroke-dashoffset:0;opacity:.65;transition:stroke-dashoffset 1800ms ease,opacity 900ms;}
.about-section.scan-active .face-map circle {opacity:.9;transition:opacity 600ms;transition-delay:var(--delay,0ms);}
.about-stats {grid-area:stats;display:grid;gap:44px;padding-top:24px;}
.profile-panel {position:relative;transition:opacity 650ms ease,transform 650ms cubic-bezier(.2,.7,.2,1);}
.experience-panel {padding:24px 14px 18px;background:var(--accent);color:#fff;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 27px) calc(100% - 16px),calc(100% - 43px) 100%,0 100%,0 16px);}
.experience-panel::before {content:"";position:absolute;right:10px;top:9px;width:55%;border-top:1px dashed #ffffffb0;}
.experience-clock {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;font-variant-numeric:tabular-nums;}
.experience-unit {text-align:center;min-width:0;}
.experience-unit strong {display:block;font-size:clamp(19px,1.8vw,29px);line-height:1.2;font-weight:400;letter-spacing:-.04em;}
.experience-unit span {display:block;font-size:7px;line-height:2;text-transform:uppercase;letter-spacing:.025em;}
.experience-panel h3 {font-size:15px;font-weight:400;margin:14px 0 4px;}
.experience-since {display:block;font:7px/1.6 'Courier New',monospace;letter-spacing:.035em;opacity:.85;}

t":"Lexus \u2014 F SPORT Event: Sounds of Spring \u2014 LXDAR200019R30E Lexus LDA FSport SoundsOfSpring Apr3 30RE FM"},"card":{"src":"./assets/c1fff178390dee12.webp","w":1760,"h":1302,"kind":"image","alt":"Lexus \u2014 F SPORT Event: Sounds of Spring"}},"rows":[["01"]],"artwork":[]},"jackson-triggs":{"index":7,"title":"Jackson-Triggs \u00d7 Cracker Barrel \u2014 Be the Holiday Hero","body":["Holiday entertaining comes with a little pressure. You want to put something on the table that people will enjoy, ideally without spending the entire evening in the kitchen. Sometimes, a dish made for sharing and a well-chosen wine are all it takes.","This holiday spot brought Jackson-Triggs and Cracker Barrel together around that idea.","Created for digital, social and television, the spot offered an appetizing answer to a familiar December question: what should we serve?"],"credits":"Concept | Design | Directing","assets":{"01":{"src":"./assets/0eeade38d0f2d7d7.webm","w":576,"h":720,"kind":"video","mime":"video/webm","alt":"Jackson-Triggs \u00d7 Cracker Barrel \u2014 Be the Holiday Hero \u2014 jacktrigg"},"card":{"src":"./assets/93f343584d3b541e.webp","w":1161,"h":1440,"kind":"image","alt":"Jackson-Triggs \u00d7 Cracker Barrel \u2014 Be the Holiday Hero"}},"rows":[["01"]],"artwork":[]},"iceberg":{"index":8,"title":"Iceberg Vodka \u2014 Rebranding","body":[],"credits":"","assets":{"01":{"src":"./assets/13faf64c293816d6.webp","w":1920,"h":1080,"kind":"image","mime":"image/webp","alt":"Iceberg Vodka \u2014 Rebranding \u2014 Iceberg Labels v4 2"},"02":{"src":"./assets/9fe61ae8a36cd2ca.webp","w":1920,"h":1080,"kind":"image","mime":"image/webp","alt":"Iceberg Vodka \u2014 Rebranding \u2014 Iceberg Labels v4 4"},"03":{"src":"./assets/ec5a6a9343374189.webp","w":1920,"h":1080,"kind":"image","mime":"image/webp","alt":"Iceberg Vodka \u2014 Rebranding \u2014 Iceberg Labels v4 3"},"04":{"src":"./assets/80f96aa7a2fe119a.webp","w":2500,"h":2000,"kind":"image","mime":"image/webp","alt":"Iceberg Vodka \u2014 Rebranding \u2014 sells-sheet-mockup 1"},"05":{"src":"./assets/b28f05dbcf2b1bb2.webp","w":2124,"h":1309,"kind":"image","mime":"image/webp","alt":"Iceberg Vodka \u2014 Rebranding \u2014 Hang-tag"},"card":{"src":"./assets/4f7df3b88ad548e4.webp","w":1276,"h":1080,"kind":"image","alt":"Iceberg Vodka \u2014 Rebranding"}},"rows":[["01"],["02","03"],["04","05"]],"artwork":[]},"tilley":{"index":9,"title":"Tilley \u00d7 Lee Valley \u2014 Adventure Hat","body":["The Tilley \u00d7 Lee Valley Adventure Hat brought together two Canadian brands with a shared appreciation for practical design and lasting quality. It was a natural partnership: a hat made for getting outside, for people who value the thought and care behind the things they use.","The creative reflected that connection, rooted in Canadian craftsmanship and outdoor culture, the story focused on a product people could see themselves wearing for years.","All units sold out in the first week."],"credits":"Copywriting | Product Design | Art Direction","assets":{"01":{"src":"./assets/11aeb83646c1a630.webp","w":6147,"h":2200,"kind":"image","mime":"image/webp","alt":"Tilley \u00d7 Lee Valley \u2014 Adventure Hat \u2014 TILLEY X LEE VALLEY 2024.10.18"},"02":{"src":"./assets/d53d45280c2887c3.webp","w":2400,"h":2400,"kind":"image","mime":"image/webp","alt":"Tilley \u00d7 Lee Valley \u2014 Adventure Hat \u2014 HT9051 Lee Valley x T5 Natural  034"},"03":{"src":"./assets/5b769bd714a6c854.webp","w":2400,"h":2400,"kind":"image","mime":"image/webp","alt":"Tilley \u00d7 Lee Valley \u2014 Adventure Hat \u2014 HT9051 Lee Valley x T5 Natural  042"},"04":{"src":"./assets/92de46c211f0084d.mp4","w":1280,"h":720,"kind":"video","mime":"video/mp4","alt":"Tilley \u00d7 Lee Valley \u2014 Adventure Hat \u2014 looking","cursorScrub":true},"05":{"src":"./assets/675b6e7e23c80a38.webp","w":3000,"h":3000,"kind":"image","mime":"image/webp","alt":"Tilley \u00d7 Lee Valley \u2014 Adventure Hat \u2014 Tilley-Bus"},"06":{"src":"./assets/2bf t":"Svedka \u2014 Spread the Curse to End the Curse \u2014 svedka-bathing-in-online-data-fc16665d59ad32d74714194258","ambient":true},"03":{"src":"./assets/6ddefce0b0292a86.webm","w":640,"h":360,"kind":"video","mime":"video/webm","alt":"Svedka \u2014 Spread the Curse to End the Curse \u2014 svedka-wrong-vodka-6036c552a7a00ec0be64530586","ambient":true},"04":{"src":"./assets/7d9dbfa4d8327eef.webm","w":640,"h":360,"kind":"video","mime":"video/webm","alt":"Svedka \u2014 Spread the Curse to End the Curse \u2014 svedka-on-your-phone-605d475441bb32856c488e4113","ambient":true},"05":{"src":"./assets/aec7c8be5ea020d2.webm","w":640,"h":360,"kind":"video","mime":"video/webm","alt":"Svedka \u2014 Spread the Curse to End the Curse \u2014 svedka-mean-things-cfe52c51828cea1e366df56054","ambient":true},"card":{"src":"./assets/9d7c4b67dfadd3fa.webp","w":2412,"h":1356,"kind":"image","alt":"Svedka \u2014 Spread the Curse to End the Curse"}},"rows":[["01"],["02","03"],["04","05"]],"artwork":[]},"kraft":{"index":11,"title":"Kraft \u2014 I love Peanut Butter","body":["There\u2019s a small problem with telling someone how much you love peanut butter while you\u2019re eating it. The words don\u2019t always come out quite right.","That familiar struggle became the idea for this Kraft campaign. People try to say \u201cI love peanut butter\u201d with a mouthful of it, turning a simple declaration into something a little less articulate. Even the dog gets a word in. You might not catch every syllable, but the feeling is clear.","The humour comes from something anyone who loves peanut butter will recognise: it sticks to the roof of your mouth, makes talking difficult and still has you reaching for another spoonful. That stickiness becomes an affectionate reminder of exactly what people enjoy about it.","Designed to extend across print, outdoor, social and television, the idea works both as a line you have to decipher and a voice you have to listen to a little more closely."],"credits":"Concept function setupCursorPortrait(player){
 const video=player.querySelector('video'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
 let target=1.05,visible=false,frame=0,disposed=false,lastStep=0;
 video.muted=true;video.pause();
 const advance=()=>{
  frame=0;if(disposed||video.readyState<2||video.seeking)return;
  const goal=Math.min(target,Math.max(0,video.duration-.05)),delta=goal-video.currentTime;
  if(Math.abs(delta)<.018)return;
  const now=performance.now(),dt=Math.min(34,Math.max(8,lastStep?now-lastStep:16));lastStep=now;
  const eased=delta*(1-Math.exp(-dt/145)),limit=1.8*dt/1000;
  video.currentTime=reduce.matches?goal:video.currentTime+Math.max(-limit,Math.min(limit,eased));
 };
 const schedule=()=>{if(!frame&&!disposed)frame=requestAnimationFrame(advance);};
 const centre=()=>{target=1.05;schedule();};
 const move=e=>{
  if(!visible||reduce.matches||e.pointerType==='touch')return;
  const r=player.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  target=x<=.5?.05+x*2:1.05+(x-.5)*2*2.35;schedule();
 };
 const ready=()=>{video.pause();schedule();};
 const observer=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(!visible)centre();},{threshold:.1});observer.observe(player);
 video.addEventListener('loadeddata',ready);video.addEventListener('seeked',schedule);
 document.addEventListener('pointermove',move);document.documentElement.addEventListener('pointerleave',centre);reduce.addEventListener('change',centre);
 if(video.readyState>=2)ready();
 filmCleanups.push(()=>{disposed=true;cancelAnimationFrame(frame);observer.disconnect();video.removeEventListener('loadeddata',ready);video.removeEventListener('seeked',schedule);document.removeEventListener('pointermove',move);document.documentElement.removeEventListener('pointerleave',centre);reduce.removeEventListener('change',centre);video.pause();});

function setupFilmPlayer(player){

 const video=player.querySelector('video,audio'),play=player.querySelector('[data-film="play"]'),sound=player.querySelector('[data-film="sound"]'),full=player.querySelector('[data-film="fullscreen"]'),seek=player.querySelector('.film-seek'),time=player.querySelector('.film-time');

 };
 let userPaused=false;play.addEventListener('click',()=>{userPaused=!video.paused;if(video.paused)video.play().catch(sync);else video.pause();});
 sound.addEventListener('click',()=>{video.muted=!video.muted;if(!video.muted&&video.volume===0)video.volume=1;sync();});
 seek.addEventListener('input',()=>{if(Number.isFinite(video.duration))video.currentTime=Number(seek.value)/100*video.duration;});
 full.addEventListener('click',()=>{if(document.fullscreenElement===player)document.exitFullscreen().catch(()=>{});else if(player.requestFullscreen)player.requestFullscreen().catch(()=>{});else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();});

// Calendar units in Eastern time, independent of the visitor's computer timezone.
function experienceParts(now=new Date()){
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now).map(p=>[p.type,p.value]));
 const current=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute,+parts.second);
 const start=Date.UTC(2017,5,28,15);
 if(current<start)return [0,0,0,0,0,0];
 let years=+parts.year-2017;
 if(Date.UTC(2017+years,5,28,15)>current)years--;
 let months=0;
 while(months<11&&Date.UTC(2017+years,5+months+1,28,15)<=current)months++;
 let remaining=Math.floor((current-Date.UTC(2017+years,5+months,28,15))/1000);
 const days=Math.floor(remaining/86400);remaining%=86400;
 const hours=Math.floor(remaining/3600);remaining%=3600;
 return [years,months,days,hours,Math.floor(remaining/60),remaining%60];
}

async function transitionToRoute(){

const viewer=document.createElement('section');viewer.id='artwork-viewer';viewer.hidden=true;viewer.tabIndex=-1;viewer.setAttribute('role','region');viewer.setAttribute('aria-label','Expanded LEGO campaign artwork');
